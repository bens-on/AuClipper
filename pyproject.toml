[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aucl"
version = "0.1.0"
description = "AuCl Auto-Clipper Engine — Phase 1 local pipeline"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["modules*", "orchestrator*", "dashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
